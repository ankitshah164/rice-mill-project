<!DOCTYPE html>
<html>
<head>

<title>Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>📊 Business Report</h2>

<form method="GET">

<label>Start Date</label>

<input type="date"
       name="start"
       class="form-control">

<br>

<label>End Date</label>

<input type="date"
       name="end"
       class="form-control">

<br>

<button class="btn btn-primary">
Filter
</button>

</form>

<hr>

<h4>Total Purchase: {{ purchase }}</h4>

<h4>Total Sales: {{ sales }}</h4>

<h4>Profit: {{ profit }}</h4>

</div>

</body>
</html>
