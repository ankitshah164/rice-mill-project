<!DOCTYPE html>
<html>
<head>
    <title>Rice Mill Dashboard</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<div class="row mb-5">

    <div class="col-md-3">
        <div class="card text-center shadow">
            <div class="card-body">
                <h5>📦 Stock</h5>
                <h3>{{ stock }}</h3>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center shadow">
            <div class="card-body">
                <h5>💰 Profit</h5>
                <h3>{{ profit }}</h3>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center shadow">
            <div class="card-body">
                <h5>🛒 Sales</h5>
                <h3>{{ total_sales }}</h3>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center shadow">
            <div class="card-body">
                <h5>🌾 Purchase</h5>
                <h3>{{ total_purchase }}</h3>
            </div>
        </div>
    </div>

</div>
<body>
   <body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-5">
        🌾 Rice Mill Management System
    </h1>

    <div class="d-grid gap-3">

        <a href="/purchase" class="btn btn-primary btn-lg">
            Add Purchase
        </a>

        <a href="/sales" class="btn btn-success btn-lg">
            Add Sales
        </a>

        <a href="/stock" class="btn btn-warning btn-lg">
            View Stock
        </a>

        <a href="/report" class="btn btn-dark btn-lg">
            View Report
        </a>

        <a href="/view_purchase" class="btn btn-info btn-lg">
            Purchase History
        </a>

        <a href="/view_sales" class="btn btn-secondary btn-lg">
            Sales History
        </a>
        <a href="/logout" class="btn btn-danger">
            <a href="/send_report"
   class="btn btn-warning">

Send Report Email

</a>
            <h5>
Logged in as:
{{ session['role'] }}
</h5>
    Logout
</a>

    </div>

</div>

</body>
</body>
</html>
